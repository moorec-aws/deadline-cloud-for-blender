name: Blender Integration Tests

on:
  workflow_dispatch:
    inputs:
      ref_type:
        description: 'Reference type to test'
        required: true
        default: 'branch'
        type: choice
        options:
          - branch
          - tag
      branch:
        description: 'Branch to test (e.g., mainline, feature-branch)'
        required: false
        default: 'mainline'
        type: string
      tag:
        description: 'Tag to test (only used when ref_type is "tag")'
        required: false
        type: string
  push:
    branches:
      - 'mainline'
      
jobs:  
  MainlineLinuxIntegrationTest:
    name: Linux Integration Tests
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_integration_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: ${{ github.event.inputs.ref_type == 'branch' && github.event.inputs.branch || '' }}
      tag: ${{ github.event.inputs.ref_type == 'tag' && github.event.inputs.tag || '' }}
      environment: ${{ github.event.inputs.ref_type == 'tag' && 'release' || 'mainline' }}
      os: linux
  MainlineWindowsIntegrationTest:
    name: Windows Integration Tests
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_integration_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: ${{ github.event.inputs.ref_type == 'branch' && github.event.inputs.branch || '' }}
      tag: ${{ github.event.inputs.ref_type == 'tag' && github.event.inputs.tag || '' }}
      environment: ${{ github.event.inputs.ref_type == 'tag' && 'release' || 'mainline' }}
      os: windows
  MainlineMacOsIntegrationTest:
    name: MacOS Integration Tests
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_integration_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: ${{ github.event.inputs.ref_type == 'branch' && github.event.inputs.branch || '' }}
      tag: ${{ github.event.inputs.ref_type == 'tag' && github.event.inputs.tag || '' }}
      environment: ${{ github.event.inputs.ref_type == 'tag' && 'release' || 'mainline' }}
      os: macos